<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f13">
<meta name="description" content="Prompt Builder για Claude - PWA εφαρμογή">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>PromptKit</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* DARK THEME */
[data-theme="dark"]{
  --bg:#0f0f13;
  --bg2:#16161d;
  --bg3:#1e1e28;
  --line:#2a2a38;
  --line2:#3a3a50;
  --text:#e8e8f0;
  --muted:#7070a0;
  --accent:#7c6aff;
  --accent2:#a892ff;
  --accent3:#3dffc3;
  --warn:#ff7c6a;
  --info:#6ab8ff;
}
/* LIGHT THEME */
[data-theme="light"]{
  --bg:#e8e8f0;
  --bg2:#f0f0f6;
  --bg3:#e0e0ec;
  --line:#d0d0e0;
  --line2:#b8b8d0;
  --text:#1a1a2e;
  --muted:#5a5a80;
  --accent:#7c6aff;
  --accent2:#5a48e0;
  --accent3:#0da870;
  --warn:#e05a3a;
  --info:#2a7ad4;
}
:root{
  --font-head:'Syne',sans-serif;
  --font-mono:'DM Mono',monospace;
  --r:8px;
  --r2:12px;
}
html{font-size:21px}
/* TRANSITIONS */
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);height:100dvh;overflow:hidden;transition:background-color .3s ease,color .3s ease}
html{overflow:hidden}


/* CARD CONTROLS */
.tpl-card{cursor:grab}
.tpl-card:active{cursor:grabbing}
.tpl-card.dragging{opacity:.4;border-style:dashed;transform:scale(.97)}
.tpl-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tpl-card.hidden-tpl{opacity:.45;border-style:dashed}
.tpl-card.pinned-tpl{order:-1}
.card-controls{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s;z-index:2}
.tpl-card:hover .card-controls{opacity:1}
.card-btn{background:var(--bg);border:1px solid var(--line2);border-radius:5px;color:var(--muted);cursor:pointer;font-size:13px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;line-height:1}
.card-btn:hover{border-color:var(--accent2);color:var(--text)}
.card-btn.active{border-color:var(--accent);color:var(--accent);background:var(--bg3)}
.tpl-card.pinned-tpl .card-btn.pin-btn{border-color:var(--accent3);color:var(--accent3)}
.grid-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.show-hidden-btn{font-size:12px;color:var(--muted);background:transparent;border:1px dashed var(--line2);border-radius:var(--r);padding:3px 10px;cursor:pointer;transition:all .2s;font-family:var(--font-mono)}
.show-hidden-btn:hover{color:var(--text);border-color:var(--line2)}
.hidden-count{font-size:11px;color:var(--muted);margin-left:auto}

/* TRANSITIONS — panels & cards */
.topbar,.sidebar,.panel,.panel-header,.tpl-card,.var-section,.output-box,.editor-textarea,.var-input,.hist-item,.drawer-panel,.ai-modal-box{transition:background-color .3s ease,border-color .3s ease}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}

/* LAYOUT */
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:64px 1fr;height:100dvh;overflow:hidden;transition:grid-template-columns .25s ease}
.app.sidebar-collapsed{grid-template-columns:40px 1fr}

/* TOPBAR */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg2)}
.logo{font-family:var(--font-head);font-size:27px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.logo span{color:var(--accent3)}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge{font-size:15px;padding:2px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--line2);color:var(--muted);font-family:var(--font-mono)}
.badge.online{border-color:var(--accent3);color:var(--accent3)}
#install-btn{display:none;font-size:16px;padding:5px 12px;border-radius:20px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:var(--font-mono);transition:opacity .2s}
#install-btn:hover{opacity:.85}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease;position:relative;overflow:visible;min-height:0}
.sidebar-content{flex:1;display:flex;flex-direction:column;overflow:hidden;transition:opacity .2s;min-height:0}
.app.sidebar-collapsed .sidebar-content{opacity:0;pointer-events:none}
.sidebar-toggle{position:absolute;top:50%;right:-13px;transform:translateY(-50%);width:26px;height:48px;border-radius:0 6px 6px 0;background:var(--bg2);border:1px solid var(--line2);border-left:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:20;transition:all .2s;box-shadow:2px 0 6px rgba(0,0,0,.15)}
.sidebar-toggle:hover{border-color:var(--accent);color:var(--accent2);background:var(--bg3)}
.app.sidebar-collapsed .sidebar-toggle{border-left:1px solid var(--line2);border-radius:0 6px 6px 0}
.app.sidebar-collapsed .sidebar-toggle{right:-14px}
.sidebar-collapsed-icons{display:none;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.app.sidebar-collapsed .sidebar-collapsed-icons{display:flex}
.collapsed-cat-btn{width:36px;height:36px;border-radius:var(--r);background:transparent;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;position:relative}
.collapsed-cat-btn:hover{background:var(--bg3);border-color:var(--line2)}
.collapsed-cat-btn.active{background:var(--bg3);border-color:var(--accent)}
.collapsed-cat-btn .cat-tooltip{position:absolute;left:44px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:4px 10px;font-size:13px;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;font-family:var(--font-mono);z-index:20}
.collapsed-cat-btn:hover .cat-tooltip{opacity:1}
.sidebar-section{padding:14px 16px 10px;font-size:15px;letter-spacing:.12em;color:var(--muted);font-family:var(--font-head);font-weight:600;text-transform:uppercase}
.cat-list{list-style:none;padding:0 8px}
.cat-item{padding:9px 12px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:17px;color:var(--muted);transition:all .15s;border:1px solid transparent}
.cat-item:hover{background:var(--bg3);color:var(--text)}
.cat-item.active{background:var(--bg3);color:var(--accent2);border-color:var(--line2)}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cat-count{margin-left:auto;font-size:14px;background:var(--bg);padding:1px 6px;border-radius:10px;color:var(--muted)}

.sidebar-divider{height:1px;background:var(--line);margin:8px 16px}
.sidebar-bottom{margin-top:auto;padding:12px}
.history-toggle{width:100%;padding:10px 14px;border-radius:var(--r);background:transparent;border:1px solid var(--line2);color:var(--muted);font-family:var(--font-mono);font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s}
.history-toggle:hover{border-color:var(--accent);color:var(--text)}
#hist-count{margin-left:auto;font-size:14px;background:var(--bg3);padding:1px 6px;border-radius:10px}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden}

/* PANEL SPLIT */
.panel-area{flex:1;display:flex;overflow:hidden}
.panel{display:flex;flex-direction:column;overflow:hidden;flex:1;min-width:0}
.panel+.panel{border-left:none}
.panel-header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--bg2)}
.panel-title{font-family:var(--font-head);font-size:17px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.08em}
.panel-sub{font-size:14px;color:var(--muted);margin-left:auto}
.panel-body{flex:1;overflow:hidden;padding:20px;display:flex;min-height:0}
.col-resizer{width:0;flex-shrink:0;cursor:col-resize;position:relative;background:transparent;transition:background .15s,width .15s}
.col-resizer.active{width:6px}
.col-resizer::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--line2);transition:background .15s}
.col-resizer:hover::after,.col-resizer.dragging::after{background:var(--accent)}

/* TEMPLATE GRID */
.template-grid{display:grid;grid-template-columns:1fr;gap:5px}
.tpl-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:grab;transition:all .2s;position:relative;overflow:hidden}
.tpl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cat-color,var(--line2));opacity:0;transition:opacity .15s}
.tpl-card:hover{border-color:var(--line2);background:var(--bg3)}
.tpl-card:hover::before{opacity:1}
.tpl-card.selected{border-color:var(--accent);background:var(--bg3)}
.tpl-card.selected::before{opacity:1;background:var(--accent)}
.tpl-name{font-family:var(--font-head);font-size:14px;font-weight:600;color:var(--text);margin-bottom:0}
.tpl-desc{font-size:14px;color:var(--muted);line-height:1.5;display:none}
.tpl-tags{display:none}
.tag{font-size:13px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line2);color:var(--muted)}

/* EDITOR PANEL */
.prompt-editor-wrap{position:relative;flex:1;display:flex;flex-direction:column;gap:12px}
.editor-textarea{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);padding:16px;font-family:var(--font-mono);font-size:17px;color:var(--text);resize:none;outline:none;line-height:1.7;min-height:120px;transition:border-color .2s}
.editor-textarea:focus{border-color:var(--accent)}
.var-section{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:12px;max-height:45vh;overflow-y:auto}
.var-title{font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;font-family:var(--font-head);font-weight:600}
.var-grid{display:grid;gap:6px}
.var-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.var-label{font-size:14px;color:var(--accent2);white-space:nowrap;font-family:var(--font-mono)}
.var-input{background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font-family:var(--font-mono);font-size:16px;color:var(--text);outline:none;transition:border-color .2s;width:100%}
.var-input:focus{border-color:var(--accent)}
.var-row{position:relative}
.hint-tooltip{position:absolute;left:0;top:calc(100% + 6px);background:var(--bg2);border:1px solid var(--accent);color:var(--text);font-family:var(--font-mono);font-size:13px;padding:8px 12px;border-radius:var(--r);line-height:1.6;z-index:50;white-space:normal;max-width:420px;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.var-row.hint-active .hint-tooltip{opacity:1;transform:translateY(0)}
.hint-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);color:var(--muted);font-size:11px;cursor:default;flex-shrink:0;transition:border-color .15s,color .15s}
.var-row.hint-active .hint-icon{border-color:var(--accent);color:var(--accent2)}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.btn{padding:9px 16px;border-radius:var(--r);font-family:var(--font-mono);font-size:15px;cursor:pointer;border:1px solid;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--muted)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-success{background:transparent;border-color:var(--accent3);color:var(--accent3)}
.btn-warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:active{transform:scale(.97)}
.copy-flash{background:var(--accent3)!important;border-color:var(--accent3)!important;color:#000!important}

/* OUTPUT */
.output-box{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);padding:16px;font-family:var(--font-mono);font-size:17px;color:var(--text);line-height:1.7;white-space:pre-wrap;word-break:break-word;min-height:80px;max-height:26vh;overflow-y:auto;position:relative}
.output-box .highlight{color:var(--accent2);font-weight:500}
.output-placeholder{color:var(--muted);font-style:italic}
.char-count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}

/* HISTORY DRAWER */
.history-drawer{position:fixed;inset:0;z-index:100;display:none}
.history-drawer.open{display:flex}
.drawer-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.drawer-panel{position:relative;margin-left:auto;width:380px;height:100%;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-title{font-family:var(--font-head);font-size:21px;font-weight:600}
.drawer-close{margin-left:auto;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px}
.drawer-close:hover{color:var(--text)}
.hist-list{flex:1;overflow-y:auto;padding:12px}
.drawer-toolbar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn-io{font-size:13px;padding:6px 12px;border-radius:var(--r);font-family:var(--font-mono);cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--muted);transition:all .2s;display:flex;align-items:center;gap:5px}
.btn-io:hover{border-color:var(--accent2);color:var(--text)}
.btn-io.export{border-color:var(--accent3);color:var(--accent3)}
.btn-io.export:hover{background:rgba(61,255,195,.08)}
.btn-io.import{border-color:var(--info);color:var(--info)}
.btn-io.import:hover{background:rgba(106,184,255,.08)}
.btn-io.danger{border-color:var(--warn);color:var(--warn)}
.btn-io.danger:hover{background:rgba(255,124,106,.08)}
.hist-item{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.hist-item:hover{border-color:var(--line2)}
.hist-item-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-item-name{font-family:var(--font-head);font-size:16px;font-weight:600;color:var(--accent2)}
.hist-item-time{font-size:13px;color:var(--muted)}
.hist-item-preview{font-size:14px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item-del{float:right;background:transparent;border:none;color:var(--warn);cursor:pointer;font-size:15px;padding:2px 4px;opacity:0;transition:opacity .15s}
.hist-item:hover .hist-item-del{opacity:1}
.hist-empty{text-align:center;color:var(--muted);font-size:16px;padding:40px 0}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--accent3);color:var(--accent3);font-family:var(--font-mono);font-size:15px;padding:10px 16px;border-radius:var(--r);opacity:0;visibility:hidden;transform:translateY(20px);transition:opacity .25s,transform .25s,visibility .25s;z-index:200}
.toast.show{opacity:1;visibility:visible;transform:translateY(0)}

/* NO TEMPLATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--muted)}
.empty-state .big{font-family:var(--font-head);font-size:32px;font-weight:700;color:var(--line2)}
.empty-state p{font-size:16px;text-align:center;line-height:1.7}

/* AI IMPROVE MODAL */
.ai-modal{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.ai-modal.open{display:flex}
.ai-modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.ai-modal-box{position:relative;width:100%;max-width:640px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;overflow:hidden;animation:popIn .2s ease}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.ai-modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ai-modal-title{font-family:var(--font-head);font-size:21px;font-weight:600;color:var(--text)}
.ai-modal-badge{font-size:13px;padding:2px 8px;border-radius:10px;background:rgba(124,106,255,.15);border:1px solid rgba(124,106,255,.4);color:var(--accent2)}
.ai-modal-close{margin-left:auto;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px}
.ai-modal-close:hover{color:var(--text)}
.ai-modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.ai-mode-tabs{display:flex;gap:6px}
.ai-tab{padding:8px 16px;border-radius:var(--r);font-family:var(--font-mono);font-size:15px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--muted);transition:all .15s}
.ai-tab:hover{color:var(--text);border-color:var(--line2)}
.ai-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.ai-preview-label{font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-head);font-weight:600;margin-bottom:6px}
.ai-preview-box{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);padding:16px;font-family:var(--font-mono);font-size:15px;color:var(--text);line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
.ai-preview-box .ai-hl{color:var(--accent3)}
.ai-modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.paste-back-area{display:none;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)}
.paste-back-area.visible{display:flex}
.paste-back-label{font-size:13px;color:var(--accent3);font-family:var(--font-head);font-weight:600;display:flex;align-items:center;gap:6px}
.paste-back-textarea{background:var(--bg3);border:1px solid var(--accent3);border-radius:var(--r2);padding:12px;font-family:var(--font-mono);font-size:13px;color:var(--text);resize:vertical;min-height:120px;outline:none;line-height:1.6;width:100%;transition:border-color .2s}
.paste-back-textarea:focus{border-color:var(--accent)}
.paste-back-actions{display:flex;gap:8px}
.btn-paste-use{background:var(--accent3);border:none;color:#000;font-family:var(--font-mono);font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--r);cursor:pointer;transition:opacity .15s}
.btn-paste-use:hover{opacity:.85}
.btn-paste-cancel{background:transparent;border:1px solid var(--line2);color:var(--muted);font-family:var(--font-mono);font-size:12px;padding:7px 14px;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-paste-cancel:hover{color:var(--text);border-color:var(--text)}
.btn-ai{background:linear-gradient(135deg,#7c6aff,#a892ff);border:none;color:#fff;font-family:var(--font-mono);font-size:17px;padding:10px 20px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;gap:7px;transition:opacity .15s;font-weight:500}
.btn-ai:hover{opacity:.88}
.btn-ai:active{transform:scale(.97)}
.btn-ai-secondary{background:transparent;border:1px solid var(--accent);color:var(--accent2);font-family:var(--font-mono);font-size:15px;padding:9px 16px;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-ai-secondary:hover{background:rgba(124,106,255,.1)}
.improve-btn{background:transparent;border:1px solid rgba(124,106,255,.5);color:var(--accent2);font-family:var(--font-mono);font-size:15px;padding:9px 16px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.improve-btn:hover{border-color:var(--accent);background:rgba(124,106,255,.1);color:#fff}
.improve-btn .spark{font-size:18px}

/* RESPONSIVE */
@media(max-width:700px){
  .app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  .sidebar{display:none}

.extra-input{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:8px 12px;font-family:var(--font-mono);font-size:14px;color:var(--text);outline:none;width:100%;transition:border-color .2s,background-color .3s}

.extra-hint{font-size:12px;color:var(--muted);line-height:1.5}

.custom-var-val{flex:1}
.btn-add-var{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-family:var(--font-mono);font-size:12px;padding:6px 12px;border-radius:var(--r);cursor:pointer;width:100%;transition:all .2s}

/* LaTeX */

<div class="app">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo">Prompt<span>Kit</span></div>
    <div class="badge online" id="sw-badge">offline ready</div>

      <button id="theme-toggle" title="Εναλλαγή θέματος" style="background:transparent;border:1px solid var(--line2);color:var(--text);font-size:18px;width:36px;height:36px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s">🌙</button>
      <button id="install-btn">↓ Install</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="Σύμπτυξη/Ανάπτυξη">‹</button>
    <div class="sidebar-content">
      <div class="sidebar-section" style="display:flex;align-items:center;justify-content:space-between;padding-right:8px">
        Templates
        <button class="history-toggle" id="hist-btn" style="padding:4px 10px;font-size:13px;width:auto">📋 <span id="hist-count">0</span></button>
      </div>
      <div style="padding:6px 8px 4px">
        <input id="tpl-search" class="var-input" type="text" placeholder="🔍 Αναζήτηση..." style="width:100%;font-size:13px">
      </div>
      <div style="flex:1;overflow-y:auto;padding:4px 8px 8px;min-height:0">
        <div class="template-grid" id="template-grid-sidebar"></div>
      </div>
    </div>
    <div class="sidebar-collapsed-icons" id="collapsed-icons"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="panel-area">
      <!-- Editor panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Editor</span>
          <span class="panel-sub" id="selected-tpl-name">Επίλεξε template</span>
        </div>
        <div class="panel-body" style="flex-direction:row;gap:0" id="editor-panel-body">

          <div id="editor-left-col" style="flex:1;display:flex;flex-direction:column;gap:14px;min-width:200px;overflow-y:auto;padding-right:16px">
            <!-- Editor -->
            <div style="display:flex;flex-direction:column;flex-shrink:0">
              <textarea class="editor-textarea" id="prompt-editor" placeholder="Επέλεξε ένα template ή γράψε το prompt σου εδώ..." style="min-height:100px;height:100px;resize:vertical"></textarea>
              <div class="char-count"><span id="char-count">0</span> χαρακτήρες</div>
            </div>

            <!-- Output -->
            <div style="flex-shrink:0">
              <div class="var-title" style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:'Syne',sans-serif;font-weight:600;margin-bottom:8px">Preview</div>
              <div class="output-box" id="output-box"><span class="output-placeholder">Το τελικό prompt θα εμφανιστεί εδώ...</span></div>
            </div>
            <!-- Actions -->
            <div class="editor-actions">
              <button class="btn btn-primary" id="copy-btn">Copy prompt</button>
              <button class="btn btn-success" id="save-btn">Αποθήκευση</button>
              <button class="btn btn-ghost" id="export-txt-btn">↓ .txt</button>
              <button class="improve-btn" id="improve-btn"><span class="spark">✨</span> Improve with Claude</button>
              <button class="btn btn-ghost" id="clear-btn">Καθαρισμός</button>
            </div>
          </div>

          <!-- Resize divider -->
          <div class="col-resizer" id="col-resizer"></div>

          <!-- RIGHT column: parameters (own scroll) -->
          <div class="var-section" id="var-section" style="display:none;flex:0 0 360px;max-height:none;overflow-y:auto;margin-left:16px">
            <div class="var-title">⚙ Παράμετροι</div>
            <div class="var-grid" id="var-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- HISTORY DRAWER -->
<div class="history-drawer" id="history-drawer">

// ─── COLUMN RESIZER ───────────────────────────────────────────────────────────
(function(){
  const resizer = document.getElementById('col-resizer');
  const rightCol = document.getElementById('var-section');
  const leftCol  = document.getElementById('editor-left-col');
  const body     = document.getElementById('editor-panel-body');
  if (!resizer || !rightCol || !leftCol || !body) return;

  const savedWidth = parseInt(localStorage.getItem('promptkit_varwidth') || '360', 10);
  rightCol.style.flexBasis = savedWidth + 'px';

  let dragging = false;
  resizer.addEventListener('mousedown', e => {
    dragging = true;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const bodyRect = body.getBoundingClientRect();
    let newRightWidth = bodyRect.right - e.clientX;
    const min = 240, max = bodyRect.width - 240;
    newRightWidth = Math.max(min, Math.min(max, newRightWidth));
    rightCol.style.flexBasis = newRightWidth + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem('promptkit_varwidth', parseInt(rightCol.style.flexBasis, 10));
  });

  resizer.addEventListener('touchstart', () => { dragging = true; resizer.classList.add('dragging'); }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    const touch = e.touches[0];
    const bodyRect = body.getBoundingClientRect();
    let newRightWidth = bodyRect.right - touch.clientX;
    const min = 240, max = bodyRect.width - 240;
    newRightWidth = Math.max(min, Math.min(max, newRightWidth));
    rightCol.style.flexBasis = newRightWidth + 'px';
  }, {passive:true});
  window.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    localStorage.setItem('promptkit_varwidth', parseInt(rightCol.style.flexBasis, 10));
  });
})();

// ─── TEMPLATE PREFS (pin/hide/order) ─────────────────────────────────────────
const tplPrefs = JSON.parse(localStorage.getItem('promptkit_tplprefs') || '{}');
// tplPrefs[id] = { pinned: bool, hidden: bool, order: number }
function saveTplPrefs() { localStorage.setItem('promptkit_tplprefs', JSON.stringify(tplPrefs)); }
function getPref(id, key, def) { return tplPrefs[id]?.[key] ?? def; }
function setPref(id, key, val) { if (!tplPrefs[id]) tplPrefs[id]={}; tplPrefs[id][key]=val; saveTplPrefs(); }

let showHidden = false;
let dragSrcId  = null;

// ─── RENDER TEMPLATES ─────────────────────────────────────────────────────────
function renderTemplates() {
  const searchQ = (document.getElementById('tpl-search')?.value || '').toLowerCase();
  let filtered = searchQ
    ? TEMPLATES.filter(t => t.name.toLowerCase().includes(searchQ) || t.tags.some(g => g.includes(searchQ)))
    : [...TEMPLATES];

  // Apply saved order
  filtered.sort((a,b) => (getPref(a.id,'order',999)) - (getPref(b.id,'order',999)));
  // Pinned first
  filtered.sort((a,b) => (getPref(b.id,'pinned',false)?1:0) - (getPref(a.id,'pinned',false)?1:0));

  const hiddenCount = filtered.filter(t => getPref(t.id,'hidden',false)).length;
  const visible     = showHidden ? filtered : filtered.filter(t => !getPref(t.id,'hidden',false));

  tplCountLabel.textContent = visible.length + ' templates';
  const catColor = '#7c6aff';

  templateGrid.innerHTML = '';

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'grid-toolbar';
  toolbar.style.gridColumn = '1/-1';
  if (hiddenCount > 0) {
    toolbar.innerHTML = `
      <button class="show-hidden-btn" id="show-hidden-btn">
        ${showHidden ? '🙈 Απόκρυψη' : '👁 Εμφάνιση'} κρυφών
      </button>
      <span class="hidden-count">${hiddenCount} κρυφά</span>`;
    toolbar.querySelector('#show-hidden-btn').onclick = () => { showHidden=!showHidden; renderTemplates(); };
    templateGrid.appendChild(toolbar);
  }

  visible.forEach((tpl, idx) => {
    const isPinned = getPref(tpl.id,'pinned',false);
    const isHidden = getPref(tpl.id,'hidden',false);
    const card = document.createElement('div');
    card.className = 'tpl-card'
      + (state.selectedTpl?.id===tpl.id ? ' selected' : '')
      + (isPinned ? ' pinned-tpl' : '')
      + (isHidden && showHidden ? ' hidden-tpl' : '');
    card.dataset.id = tpl.id;
    card.draggable = true;
    card.style.setProperty('--cat-color', catColor);
    card.innerHTML = `
      <div class="card-controls">
        <button class="card-btn pin-btn${isPinned?' active':''}" title="${isPinned?'Ξεκαρφίτσωμα':'Καρφίτσωμα'}">📌</button>
        <button class="card-btn hide-btn" title="${isHidden?'Εμφάνιση':'Απόκρυψη'}">${isHidden?'👁':'🙈'}</button>
      </div>
      <div class="tpl-name">${isPinned?'📌 ':''}${tpl.name}</div>
      <div class="tpl-desc">${tpl.desc}</div>
      <div class="tpl-tags">${tpl.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;

    // Select on click (not on control buttons)
    card.onclick = (e) => { if (!e.target.closest('.card-controls')) selectTemplate(tpl); };

    // Pin
    card.querySelector('.pin-btn').onclick = (e) => {
      e.stopPropagation();
      setPref(tpl.id, 'pinned', !isPinned);
      renderTemplates();
    };
    // Hide
    card.querySelector('.hide-btn').onclick = (e) => {
      e.stopPropagation();
      setPref(tpl.id, 'hidden', !isHidden);
      renderTemplates();
    };

    // Drag & drop
    card.addEventListener('dragstart', e => {
      dragSrcId = tpl.id;
      setTimeout(() => card.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (dragSrcId === tpl.id) return;
      // Swap orders
      const srcOrder = getPref(dragSrcId,'order', TEMPLATES.findIndex(t=>t.id===dragSrcId));
      const dstOrder = getPref(tpl.id,    'order', TEMPLATES.findIndex(t=>t.id===tpl.id));
      setPref(dragSrcId, 'order', dstOrder);
      setPref(tpl.id,    'order', srcOrder);
      renderTemplates();
    });

    templateGrid.appendChild(card);
  });
}

function selectTemplate(tpl) {
  state.selectedTpl = tpl;
  state.vars = {};
  tpl.vars.forEach(v => { state.vars[v] = ''; });

  promptEditor.value = tpl.template;
  selectedName.textContent = tpl.name;

  // Render variable inputs
  if (tpl.vars.length > 0) {
    setVarSectionVisible(true);
    varGrid.innerHTML = '';
    tpl.vars.forEach(v => {
      const row = document.createElement('div');
      row.className = 'var-row';
      const hint = HINTS[v] || v.replace(/_/g,' ') + '...';
      row.innerHTML = `
        <label class="var-label" style="display:flex;align-items:center;gap:6px;">
          {{${v}}}
        </label>
        <input class="var-input" type="text" placeholder="${hint}" data-var="${v}">`;
      varGrid.appendChild(row);
    });
    varGrid.querySelectorAll('.var-input').forEach(inp => {
      inp.oninput = () => { state.vars[inp.getAttribute('data-var')] = inp.value; updateOutput(); };
    });

    // Tooltip: show on row hover, hide when any input in the grid is focused
    function isAnyInputFocused() {
      return [...varGrid.querySelectorAll('.var-input')].some(i => i === document.activeElement);
    }
    varGrid.querySelectorAll('.var-row').forEach(row => {
      row.addEventListener('mouseenter', () => {
        if (!isAnyInputFocused()) row.classList.add('hint-active');
      });
      row.addEventListener('mouseleave', () => row.classList.remove('hint-active'));
    });
    varGrid.querySelectorAll('.var-input').forEach(inp => {
      inp.addEventListener('focus', () => {
        varGrid.querySelectorAll('.var-row').forEach(r => r.classList.remove('hint-active'));
      });
      inp.addEventListener('blur', () => {
        // small delay so mouseleave fires first
        setTimeout(() => {}, 100);
      });
    });

    // Render custom vars inline at the bottom of var-section
    renderInlineCustomVars();
  } else {
    setVarSectionVisible(false);
  }

  updateOutput();
  renderTemplates();
}

// ─── BUILD EXTRAS ─────────────────────────────────────────────────────────────
function buildExtras() {
  const parts = [];
  const urlEl = document.getElementById('extra-link-url');
  const descEl = document.getElementById('extra-link-desc');
  const url  = urlEl?.value.trim() || '';
  const desc = descEl?.value.trim() || '';
  if (url) parts.push('\n\nΑναφορά / Παράδειγμα: ' + (desc ? desc + ' — ' : '') + url);
  const fmlEl = document.getElementById('extra-formulas');
  const fml = fmlEl?.value.trim() || '';
  if (fml) parts.push('\n\nΣχετικοί νόμοι / τύποι:\n' + fml);
  // Graph vars
  if (state.graphVars && state.graphVars.length) {
    const filled = state.graphVars.filter(g => g.xVar || g.yVar);
    if (filled.length) {
      const opts = [];
      // gopt elements are dynamically created — read from state instead
      if (state.gopts?.realtime !== false) opts.push('real-time ενημέρωση');
      if (state.gopts?.legend   !== false) opts.push('legend');
      if (state.gopts?.pause)              opts.push('pause/resume button');
      if (state.gopts?.export)             opts.push('export PNG button');
      const varLines = filled.map((g,i) => {
        const t = g.title ? ` "${g.title}"` : ` #${i+1}`;
        return `  - Διάγραμμα${t}: Χ=${g.xVar||'?'} / Υ=${g.yVar||'?'} → ${g.type} chart`;
      }).join('\n');
      parts.push('\n\nΓραφικές παραστάσεις (real-time):\n' + varLines +
        (opts.length ? '\nΕπιπλέον: ' + opts.join(', ') : '') +
        '\nΧρησιμοποίησε Canvas ή SVG, χωρίς εξωτερικές βιβλιοθήκες. Τα γραφήματα να ενημερώνονται σε κάθε frame του simulation loop.');
    }
  }
  return parts.join('');
}

// ─── UPDATE OUTPUT ────────────────────────────────────────────────────────────
function updateOutput() {
  let text = promptEditor.value;
  charCount.textContent = text.length;

  let rendered = text;
  // Template vars
  Object.entries(state.vars).forEach(([k,v]) => {
    rendered = rendered.replaceAll(`{{${k}}}`, v || `{{${k}}}`);
  });
  // Custom vars
  (state.customVars || []).forEach(cv => {
    if (cv.name && cv.value) rendered = rendered.replaceAll(`{{${cv.name}}}`, cv.value);
  });
  // Extras appended
  rendered += buildExtras();

  // Highlight unfilled vars
  const html = rendered
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\{\{([^}]+)\}\}/g, '<span class="highlight">{{$1}}</span>');

  outputBox.innerHTML = html || '<span class="output-placeholder">Το τελικό prompt θα εμφανιστεί εδώ...</span>';
}

function renderHistory() {
  if (!state.history.length) {
    histList.innerHTML = '<div class="hist-empty">Δεν υπάρχουν αποθηκευμένα prompts</div>';
    return;
  }
  histList.innerHTML = '';
  state.history.forEach(entry => {
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.innerHTML = `
      <div class="hist-item-meta">
        <span class="hist-item-name">${entry.name}</span>

      </div>
      <div class="hist-item-time">${entry.time}</div>
      <div class="hist-item-preview">${entry.text.slice(0,80)}...</div>`;
    item.onclick = (e) => {
      if (e.target.dataset.id) return;
      promptEditor.value = entry.text;
      state.vars = {...(entry.vars||{})};
      // Refill var inputs if template selected
      varGrid.querySelectorAll('.var-input').forEach(inp => {
        inp.value = state.vars[inp.dataset.var] || '';
      });
      updateOutput();
      closeHistory();
    };
    item.querySelector('.hist-item-del').onclick = (e) => {
      e.stopPropagation();
      state.history = state.history.filter(h=>h.id!==entry.id);
      localStorage.setItem('promptkit_history', JSON.stringify(state.history));
      updateHistCount();
      renderHistory();
    };
    histList.appendChild(item);
  });
}

document.getElementById('import-btn-trigger').onclick = () => {

document.getElementById('import-file-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const incoming = parsed.prompts || parsed; // support both formats
      if (!Array.isArray(incoming)) throw new Error('Μη έγκυρο αρχείο');
      // Merge: avoid duplicates by id
      const existingIds = new Set(state.history.map(h => h.id));
      const newItems = incoming.filter(p => !existingIds.has(p.id));
      state.history = [...newItems, ...state.history].slice(0, 100);
      localStorage.setItem('promptkit_history', JSON.stringify(state.history));
      updateHistCount();
      renderHistory();
      showToast('✓ Εισαγωγή ' + newItems.length + ' νέων prompts');
    } catch(err) {
      showToast('✗ Σφάλμα: ' + err.message);
    }
    e.target.value = ''; // reset so same file can be re-imported
  };
  reader.readAsText(file);
};

document.getElementById('clear-history-btn').onclick = () => {
  if (!state.history.length) return showToast('Το history είναι ήδη κενό');
  if (!confirm('Διαγραφή όλων των ' + state.history.length + ' prompts;')) return;
  state.history = [];
  localStorage.setItem('promptkit_history', JSON.stringify(state.history));
  updateHistCount();
  renderHistory();
  showToast('🗑 History διαγράφηκε');
};

  navigator.serviceWorker.register('sw.js')
    .then(() => { document.getElementById('sw-badge').textContent = 'offline ready'; })
    .catch(() => { document.getElementById('sw-badge').textContent = 'online only'; document.getElementById('sw-badge').classList.remove('online'); });
}


// ─── AI IMPROVE ───────────────────────────────────────────────────────────────
const aiModal       = document.getElementById('ai-modal');
const aiModalOverlay= document.getElementById('ai-modal-overlay');
const aiModalClose  = document.getElementById('ai-modal-close');
const aiPreviewBox  = document.getElementById('ai-preview-box');
const aiOpenBtn     = document.getElementById('ai-open-btn');
const aiCopyBtn     = document.getElementById('ai-copy-btn');
const aiTabs        = document.querySelectorAll('.ai-tab');

let aiMode = 'improve';
let aiCurrentText = '';

const AI_META_PROMPTS = {
  improve: (prompt) => `Είσαι ειδικός στη δημιουργία αποτελεσματικών prompts για LLMs.

Βελτίωσε το παρακάτω prompt ώστε να:
- Είναι πιο συγκεκριμένο και ξεκάθαρο
- Δίνει πλαίσιο και context
- Ορίζει το επιθυμητό format εξόδου
- Περιλαμβάνει examples αν χρειάζεται
- Αποφεύγει ασάφειες

PROMPT ΠΡΟΣ ΒΕΛΤΙΩΣΗ:
---
${prompt}
---

Δώσε μου:
1. Το βελτιωμένο prompt
2. Σύντομη εξήγηση τι άλλαξες και γιατί`,

  send: (prompt) => prompt,

  explain: (prompt) => `Ανάλυσε το παρακάτω prompt και εξήγησε:

1. Τι στρατηγική χρησιμοποιεί (chain-of-thought, few-shot, role prompting, κ.λπ.)
2. Τι κάνει καλά
3. Πιθανές αδυναμίες ή ασάφειες
4. Πώς θα μπορούσε να βελτιωθεί για διαφορετικά μοντέλα (Claude, GPT-4, κ.λπ.)

PROMPT:
---
${prompt}
---`,
};

const AI_MODE_LABELS = {
  improve: 'Βελτίωση prompt',
  send: 'Αποστολή prompt',
  explain: 'Εξήγηση στρατηγικής',
};

function getResolvedPrompt() {
  let text = promptEditor.value;
  Object.entries(state.vars).forEach(([k,v]) => {
    if (v) text = text.replaceAll(`{{${k}}}`, v);
  });
  return text.trim();
}

function buildAiText(mode) {
  const resolved = getResolvedPrompt();
  if (!resolved) return '';
  return AI_META_PROMPTS[mode](resolved);
}

function highlightAiPreview(text) {
  if (!text) return '<span style="color:var(--muted);font-style:italic">Δεν υπάρχει prompt για βελτίωση...</span>';
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Highlight the original prompt block
  return escaped.replace(/(---[\s\S]*?---)/g, '<span class="ai-hl">$1</span>');
}

function updateAiPreview() {
  aiCurrentText = buildAiText(aiMode);
  aiPreviewBox.innerHTML = highlightAiPreview(aiCurrentText);
}

document.getElementById('improve-btn').onclick = () => {
  const resolved = getResolvedPrompt();
  if (!resolved) return showToast('Γράψε πρώτα ένα prompt');
  updateAiPreview();
  aiModal.classList.add('open');
};

aiTabs.forEach(tab => {
  tab.onclick = () => {
    aiTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    aiMode = tab.dataset.mode;
    updateAiPreview();
    aiOpenBtn.textContent = aiMode === 'send'
      ? 'Άνοιγμα στο claude.ai ↗'
      : 'Βελτίωση στο claude.ai ↗';
  };
});

function closeAiModal() { aiModal.classList.remove('open'); }
aiModalOverlay.onclick = closeAiModal;
aiModalClose.onclick = closeAiModal;

const pasteBackArea     = document.getElementById('paste-back-area');
const pasteBackTextarea = document.getElementById('paste-back-textarea');
const pasteUseBtn       = document.getElementById('paste-use-btn');
const pasteCancelBtn    = document.getElementById('paste-cancel-btn');

aiOpenBtn.onclick = () => {
  if (!aiCurrentText) return;
  const encoded = encodeURIComponent(aiCurrentText);
  const url = `https://claude.ai/new?q=${encoded}`;
  window.open(url, '_blank');
  // Show paste-back area instead of closing modal
  pasteBackArea.classList.add('visible');
  pasteBackTextarea.value = '';
  pasteBackTextarea.focus();
  aiOpenBtn.textContent = '↗ Άνοιγμα ξανά';
  showToast('✓ Άνοιξε το claude.ai — επικόλλησε την απάντηση παρακάτω');
};

pasteUseBtn.onclick = () => {
  const text = pasteBackTextarea.value.trim();
  if (!text) return showToast('Δεν υπάρχει κείμενο για χρήση');
  // Load into editor
  promptEditor.value = text;
  state.selectedTpl = null;
  state.vars = {};
  setVarSectionVisible(false);
  if (document.getElementById('selected-tpl-name')) document.getElementById('selected-tpl-name').textContent = 'Βελτιωμένο prompt';
  updateOutput();
  // Reset & close modal
  pasteBackArea.classList.remove('visible');
  pasteBackTextarea.value = '';
  aiOpenBtn.textContent = 'Άνοιγμα στο claude.ai ↗';
  closeAiModal();
  showToast('✓ Το βελτιωμένο prompt φορτώθηκε στον editor');
};

pasteCancelBtn.onclick = () => {
  pasteBackArea.classList.remove('visible');
  pasteBackTextarea.value = '';
  aiOpenBtn.textContent = 'Άνοιγμα στο claude.ai ↗';
};

aiCopyBtn.onclick = async () => {
  if (!aiCurrentText) return;
  await navigator.clipboard.writeText(aiCurrentText);
  aiCopyBtn.textContent = '✓ Αντιγράφηκε!';
  setTimeout(() => { aiCopyBtn.textContent = 'Copy text'; }, 1500);
};

// ─── THEME TOGGLE ────────────────────────────────────────────────────────────
(function(){
  const root = document.documentElement;
  const btn  = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('theme') || 'light';
  function applyTheme(t){
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', t);
  }
  applyTheme(saved);
  btn.onclick = () => applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
})();

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderCats();
renderTemplates();
updateHistCount();
</script>
